# DigitalOcean App Platform spec — BUDGET layout (about $20/month; cap is $35).
#   web service  apps-s-1vcpu-0.5gb  $5/month   (1 instance, shared CPU, 512 MB)
#   PostgreSQL   managed cluster     ~$15/month (1 GB, daily backups)  — created separately, see cluster_name below
#   cache        none: VALKEY_URL=memory keeps sessions/rate-limit counters inside the single web process
# Upgrade path when traffic grows: add a managed Valkey ($15), set VALKEY_URL to it, then raise instance_count /
# switch to a dedicated-CPU size with autoscaling (e.g. apps-d-1vcpu-2gb).
#
# Create/update:  doctl apps create --spec .do/app.yaml      or paste into the control panel (Settings → App Spec).
# Secrets marked type: SECRET get their values in the control panel (Settings → App-Level Environment Variables) — never commit them.
name: prompts360
region: nyc

# App-level env vars: shared by the web service and the migrate job.
envs:
  - { key: NODE_ENV, value: production }
  - { key: BASE_URL, value: "https://prompts360.si" }
  - { key: DATABASE_URL, value: "${db.DATABASE_URL}" }
  - { key: DATABASE_CA_CERT, value: "${db.CA_CERT}" }
  - { key: VALKEY_URL, value: memory }              # in-process store (see src/kv.js MemoryClient)
  - { key: APP_SECRET, type: SECRET }               # node scripts/gen-keys.js
  - { key: DATA_KEY, type: SECRET }
  - { key: TURNSTILE_SITE_KEY, value: "0x4AAAAAAFynCvbae2XX5uhV" }   # public by design
  - { key: TURNSTILE_SECRET, type: SECRET }
  - { key: ADMIN_PATH, type: SECRET }               # hidden dashboard URL path, e.g. /x-<24 random chars>
  - { key: ADMIN_BOOTSTRAP_HASH, type: SECRET }     # node scripts/make-admin-hash.js (peppered Argon2id hash)
  - { key: MAIL_TRANSPORT, value: console }         # switch to "gmail" (+ GMAIL_* secrets) once the sender is set up
  - { key: MAIL_FROM, value: "prompts360 <REPLACE_ME@gmail.com>" }
  - { key: CLIENT_IP_HEADER, value: do-connecting-ip }  # set by App Platform's edge; can't be spoofed through it
  - { key: EDGE_CACHE_SEC, value: "0" }                 # App Platform's CDN can't bypass on session cookie
  - { key: WEB_CONCURRENCY, value: "1" }                # 1 process per 1-vCPU container
  - { key: DB_POOL_MAX, value: "8" }                    # small managed PG has ~25 connections; leave room for the migrate job

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: prompts360-db          # create this managed PostgreSQL cluster first (same region)

services:
  - name: web
    github:
      repo: FabiGjuzi/prompts360
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz

jobs:
  - name: migrate
    kind: PRE_DEPLOY                     # schema migrations run once before each deploy goes live
    github:
      repo: FabiGjuzi/prompts360
      branch: main
    dockerfile_path: Dockerfile
    run_command: node scripts/migrate.js
    instance_size_slug: apps-s-1vcpu-0.5gb
